<rect width="1000" height="112" rx="18" fill="#0f2942"/>
<text x="42" y="47" fill="#fff" font-family="Arial, sans-serif" font-size="25" font-weight="700">H-PSO-GA — DI CHUYỂN RỒI LAI GHÉP / ĐỘT BIẾN</text>
<text x="42" y="81" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="18">Một bầy duy nhất; các bước chạy nối tiếp trên cùng bầy</text>
