<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1023" viewBox="0 0 1000 1023" role="img" aria-labelledby="title desc">
<title id="title">H-PSO-GA — DI CHUYỂN RỒI LAI GHÉP / ĐỘT BIẾN</title>
<desc id="desc">1. KHỞI TẠO BẦY PSO: Vị trí, vận tốc, pbest, gbest và điểm ban đầu. 2. PHA PSO: Cập nhật vận tốc và vị trí của từng hạt; xử lý biên. 3. PHA CROSSOVER: Xáo trộn chỉ số; ghép cặp; lai ghép số học với xác suất 0,8. 4. PHA MUTATION: Đột biến Gaussian từng tọa độ với xác suất 0,15. 5. CHẤM ĐIỂM VÀ CẬP NHẬT BEST: Đánh giá sau các pha; cập nhật pbest/gbest. 6. LƯU MỐC VÀ LẶP: Ablation tắt crossover hoặc mutation; PSO gốc là đối chứng.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker></defs>
