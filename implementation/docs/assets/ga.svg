<text x="64" y="790" fill="#334155" font-family="Arial, sans-serif" font-size="18">Giữ 2 cá thể cha tốt; bổ sung con tốt để đủ P cá thể.</text>
<path d="M484 820 V845" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
