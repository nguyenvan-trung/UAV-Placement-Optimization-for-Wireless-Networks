<circle cx="79" cy="604" r="20" fill="#0e7490"/>
<text x="79" y="611" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="20">4</text>
<text x="116" y="608" fill="#0f2942" font-family="Arial, sans-serif" font-size="21" font-weight="700">ĐỘT BIẾN VÀ ĐÁNH GIÁ</text>
<text x="64" y="647" fill="#334155" font-family="Arial, sans-serif" font-size="18">Thêm nhiễu Gaussian theo xác suất; clip biên; chấm fitness con.</text>
