<text x="116" y="322" fill="#0f2942" font-family="Arial, sans-serif" font-size="21" font-weight="700">CHỌN HAI CHA MẸ</text>
<text x="64" y="361" fill="#334155" font-family="Arial, sans-serif" font-size="18">Tournament: lấy 3 ứng viên, chọn ứng viên có fitness cao nhất.</text>
