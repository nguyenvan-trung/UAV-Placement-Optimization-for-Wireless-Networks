<circle cx="79" cy="461" r="20" fill="#0e7490"/>
<text x="79" y="468" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="20">3</text>
<text x="116" y="465" fill="#0f2942" font-family="Arial, sans-serif" font-size="21" font-weight="700">LAI GHÉP SỐ HỌC</text>
<text x="64" y="504" fill="#334155" font-family="Arial, sans-serif" font-size="18">Trộn từng tọa độ của hai cha mẹ để tạo hai con.</text>
