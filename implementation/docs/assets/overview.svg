<text x="116" y="322" fill="#0f2942" font-family="Arial, sans-serif" font-size="21" font-weight="700">BÀI TOÁN CHUNG</text>
<text x="64" y="361" fill="#334155" font-family="Arial, sans-serif" font-size="18">4 UAV → nghiệm 12 chiều; miền tọa độ, độ cao và khoảng cách.</text>
