<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1023" viewBox="0 0 1000 1023" role="img" aria-labelledby="title desc">
<title id="title">TỪ TỌA ĐỘ USER ĐẾN PHƯƠNG ÁN ĐẶT UAV</title>
<desc id="desc">1. DỮ LIỆU USER: 500 CSV có sẵn; mỗi dòng là tọa độ và demand của một user. 2. BÀI TOÁN CHUNG: 4 UAV → nghiệm 12 chiều; miền tọa độ, độ cao và khoảng cách. 3. TÌM KIẾM PHƯƠNG ÁN: GA • PSO • WOA • H-PSO-GA • H-WOA-PSO • I-WOA 4. ĐÁNH GIÁ MỖI ỨNG VIÊN: Kênh truyền → SNR → C, E, I → fitness; phản hồi cho thuật toán. 5. LƯU DẤU VẾT: Một task = dataset × case × seed; lưu best qua 101 mốc. 6. BẢNG, BIỂU ĐỒ VÀ NHẬN XÉT: Chỉ tổng hợp khi đủ task; so chất lượng, chi phí và ổn định.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker></defs>
<rect width="1000" height="1023" rx="18" fill="#f1f5f9"/>
<rect width="1000" height="112" rx="18" fill="#0f2942"/>
<text x="42" y="47" fill="#fff" font-family="Arial, sans-serif" font-size="25" font-weight="700">TỪ TỌA ĐỘ USER ĐẾN PHƯƠNG ÁN ĐẶT UAV</text>
<text x="42" y="81" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="18">Mô hình tổng quan của dự án • Không phải kết quả thực nghiệm</text>
<rect x="42" y="140" width="885" height="103" rx="12" fill="#fff" stroke="#cbd5e1"/>
<circle cx="79" cy="175" r="20" fill="#0e7490"/>
<text x="79" y="182" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="20">1</text>
<text x="116" y="179" fill="#0f2942" font-family="Arial, sans-serif" font-size="21" font-weight="700">DỮ LIỆU USER</text>
<text x="64" y="218" fill="#334155" font-family="Arial, sans-serif" font-size="18">500 CSV có sẵn; mỗi dòng là tọa độ và demand của một user.</text>
