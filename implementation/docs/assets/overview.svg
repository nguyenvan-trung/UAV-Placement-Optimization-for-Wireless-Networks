<text x="116" y="608" fill="#0f2942" font-family="Arial, sans-serif" font-size="21" font-weight="700">ĐÁNH GIÁ MỖI ỨNG VIÊN</text>
<text x="64" y="647" fill="#334155" font-family="Arial, sans-serif" font-size="18">Kênh truyền → SNR → C, E, I → fitness; phản hồi cho thuật toán.</text>
