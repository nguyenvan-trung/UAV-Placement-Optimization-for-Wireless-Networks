<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1023" viewBox="0 0 1000 1023" role="img" aria-labelledby="title desc">
<title id="title">I-WOA — LÕI WOA VÀ BA TOÁN TỬ BỔ SUNG</title>
<desc id="desc">1. K — NGHIỆM MẦM K-MEANS: Gom user theo XY; thay một cấu hình ngẫu nhiên bằng nghiệm tâm cụm. 2. O — OBL KHỞI TẠO: Tạo nghiệm đối lập, chấm thêm, chọn P tốt nhất từ hai quần thể. 3. LÕI WOA: Mỗi cá thể dùng một nhánh bao vây, khám phá hoặc xoắn ốc. 4. L — ĐỀ XUẤT LÉVY: Theo xác suất 0,3; chỉ nhận đề xuất tốt hơn ứng viên trước đó. 5. O — OBL ĐỘNG: Theo xác suất 0,2 mỗi vòng; phản chiếu theo biên quần thể hiện tại. 6. GIỮ BEST VÀ LƯU LỊCH SỬ: Lặp lõi WOA; mọi đánh giá bổ sung phải được tính vào FE.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker></defs>
<rect width="1000" height="1023" rx="18" fill="#f1f5f9"/>
<rect width="1000" height="112" rx="18" fill="#0f2942"/>
<text x="42" y="47" fill="#fff" font-family="Arial, sans-serif" font-size="25" font-weight="700">I-WOA — LÕI WOA VÀ BA TOÁN TỬ BỔ SUNG</text>
<text x="42" y="81" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="18">Bật/tắt K, O, L để kiểm tra đóng góp; không mặc định luôn cải thiện</text>
<rect x="42" y="140" width="885" height="103" rx="12" fill="#fff" stroke="#cbd5e1"/>
<circle cx="79" cy="175" r="20" fill="#0e7490"/>
<text x="79" y="182" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="20">1</text>
<text x="116" y="179" fill="#0f2942" font-family="Arial, sans-serif" font-size="21" font-weight="700">K — NGHIỆM MẦM K-MEANS</text>
<text x="64" y="218" fill="#334155" font-family="Arial, sans-serif" font-size="18">Gom user theo XY; thay một cấu hình ngẫu nhiên bằng nghiệm tâm cụm.</text>
<path d="M484 248 V273" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="42" y="283" width="885" height="103" rx="12" fill="#fff" stroke="#cbd5e1"/>
<circle cx="79" cy="318" r="20" fill="#0e7490"/>
<text x="79" y="325" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="20">2</text>
<text x="116" y="322" fill="#0f2942" font-family="Arial, sans-serif" font-size="21" font-weight="700">O — OBL KHỞI TẠO</text>
<text x="64" y="361" fill="#334155" font-family="Arial, sans-serif" font-size="18">Tạo nghiệm đối lập, chấm thêm, chọn P tốt nhất từ hai quần thể.</text>
<path d="M484 391 V416" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="42" y="426" width="885" height="103" rx="12" fill="#fff" stroke="#cbd5e1"/>
<circle cx="79" cy="461" r="20" fill="#0e7490"/>
<text x="79" y="468" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="20">3</text>
<text x="116" y="465" fill="#0f2942" font-family="Arial, sans-serif" font-size="21" font-weight="700">LÕI WOA</text>
<text x="64" y="504" fill="#334155" font-family="Arial, sans-serif" font-size="18">Mỗi cá thể dùng một nhánh bao vây, khám phá hoặc xoắn ốc.</text>
<path d="M484 534 V559" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="42" y="569" width="885" height="103" rx="12" fill="#fff" stroke="#cbd5e1"/>
<circle cx="79" cy="604" r="20" fill="#0e7490"/>
<text x="79" y="611" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="20">4</text>
<text x="116" y="608" fill="#0f2942" font-family="Arial, sans-serif" font-size="21" font-weight="700">L — ĐỀ XUẤT LÉVY</text>
<text x="64" y="647" fill="#334155" font-family="Arial, sans-serif" font-size="18">Theo xác suất 0,3; chỉ nhận đề xuất tốt hơn ứng viên trước đó.</text>
<path d="M484 677 V702" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="42" y="712" width="885" height="103" rx="12" fill="#fff" stroke="#cbd5e1"/>
<circle cx="79" cy="747" r="20" fill="#0e7490"/>
<text x="79" y="754" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="20">5</text>
<text x="116" y="751" fill="#0f2942" font-family="Arial, sans-serif" font-size="21" font-weight="700">O — OBL ĐỘNG</text>
<text x="64" y="790" fill="#334155" font-family="Arial, sans-serif" font-size="18">Theo xác suất 0,2 mỗi vòng; phản chiếu theo biên quần thể hiện tại.</text>
<path d="M484 820 V845" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="42" y="855" width="885" height="103" rx="12" fill="#fff" stroke="#cbd5e1"/>
<circle cx="79" cy="890" r="20" fill="#0e7490"/>
<text x="79" y="897" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="20">6</text>
<text x="116" y="894" fill="#0f2942" font-family="Arial, sans-serif" font-size="21" font-weight="700">GIỮ BEST VÀ LƯU LỊCH SỬ</text>
<text x="64" y="933" fill="#334155" font-family="Arial, sans-serif" font-size="18">Lặp lõi WOA; mọi đánh giá bổ sung phải được tính vào FE.</text>
<path d="M930 905 H965 V333 H934" fill="none" stroke="#0e7490" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
</svg>
