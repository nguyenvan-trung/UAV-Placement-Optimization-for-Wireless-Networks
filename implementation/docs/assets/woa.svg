<text x="116" y="751" fill="#0f2942" font-family="Arial, sans-serif" font-size="21" font-weight="700">LẶP CHO MỖI CÁ THỂ / MỖI VÒNG</text>
<text x="64" y="790" fill="#334155" font-family="Arial, sans-serif" font-size="18">Lưu best sau mỗi vòng; dừng theo giao thức iterations hoặc FE.</text>
<path d="M930 762 H965 V333 H934" fill="none" stroke="#0e7490" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
