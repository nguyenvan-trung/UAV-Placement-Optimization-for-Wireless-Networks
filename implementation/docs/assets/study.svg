<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1023" viewBox="0 0 1000 1023" role="img" aria-labelledby="title desc">
<title id="title">THIẾT KẾ → THỰC THI → BẰNG CHỨNG</title>
<desc id="desc">1. CHỐT THIẾT KẾ: 500 CSV • 30 case • 100 vòng • 4 UAV • quần thể 25 • danh sách seed 2. KIỂM TRA VÀ DUYỆT CHẠY: Xử lý mục còn thiếu; chọn kernel; xác nhận trước benchmark. 3. THỰC THI TỪNG TASK: Cùng dataset/seed cho các case; lưu JSON khi task hoàn tất. 4. KIỂM TRA ĐỦ VÀ NHẤT QUÁN: Đối chiếu manifest, khóa task, history, nghiệm và metric. 5. TỔNG HỢP BẢNG / VẼ ẢNH: Đọc artifact; không chạy tối ưu lại chỉ để vẽ. 6. ĐÁNH GIÁ VÀ TRUY NGUỒN: So chất lượng / chi phí / ổn định; ghi giới hạn và nguồn mỗi bảng.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker></defs>
<rect width="1000" height="1023" rx="18" fill="#f1f5f9"/>
<rect width="1000" height="112" rx="18" fill="#0f2942"/>
<text x="42" y="47" fill="#fff" font-family="Arial, sans-serif" font-size="25" font-weight="700">THIẾT KẾ → THỰC THI → BẰNG CHỨNG</text>
<text x="42" y="81" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="18">Các mũi tên thể hiện quy trình dự kiến; study hiện chưa chạy</text>
<rect x="42" y="140" width="885" height="103" rx="12" fill="#fff" stroke="#cbd5e1"/>
