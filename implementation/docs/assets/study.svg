<text x="116" y="179" fill="#0f2942" font-family="Arial, sans-serif" font-size="21" font-weight="700">CHỐT THIẾT KẾ</text>
<text x="64" y="218" fill="#334155" font-family="Arial, sans-serif" font-size="18">500 CSV • 30 case • 100 vòng • 4 UAV • quần thể 25 • danh sách seed</text>
