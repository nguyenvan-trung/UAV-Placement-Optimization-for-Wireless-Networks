<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1023" viewBox="0 0 1000 1023" role="img" aria-labelledby="title desc">
<title id="title">BÊN TRONG MỘT LẦN ĐÁNH GIÁ FITNESS</title>
<desc id="desc">1. ỨNG VIÊN X VÀ TỌA ĐỘ USER: X chứa vị trí của cả đội UAV; user giữ cố định trong một dataset. 2. MIỀN VÀ RÀNG BUỘC: Clip tọa độ; kiểm tra khoảng cách UAV; vi phạm → fitness −∞. 3. LIÊN KẾT UAV–USER: Khoảng cách 3D → góc → xác suất LoS → suy hao → SNR. 4. BA THÀNH PHẦN: C: phủ user • E: proxy công suất • I: chồng lấn theo user 5. ĐIỂM TỔNG HỢP: F = 0,6 × C − 0,2 × E − 0,2 × I; càng cao càng tốt. 6. TRẢ KẾT QUẢ VỀ TÌM KIẾM: Thuật toán dùng điểm để chọn/cập nhật; không thay tọa độ user.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker></defs>
<rect width="1000" height="1023" rx="18" fill="#f1f5f9"/>
<rect width="1000" height="112" rx="18" fill="#0f2942"/>
<text x="42" y="47" fill="#fff" font-family="Arial, sans-serif" font-size="25" font-weight="700">BÊN TRONG MỘT LẦN ĐÁNH GIÁ FITNESS</text>
<text x="42" y="81" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="18">Cùng một mô hình được dùng cho mọi thuật toán</text>
<rect x="42" y="140" width="885" height="103" rx="12" fill="#fff" stroke="#cbd5e1"/>
<circle cx="79" cy="175" r="20" fill="#0e7490"/>
<text x="79" y="182" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="20">1</text>
<text x="116" y="179" fill="#0f2942" font-family="Arial, sans-serif" font-size="21" font-weight="700">ỨNG VIÊN X VÀ TỌA ĐỘ USER</text>
<text x="64" y="218" fill="#334155" font-family="Arial, sans-serif" font-size="18">X chứa vị trí của cả đội UAV; user giữ cố định trong một dataset.</text>
<path d="M484 248 V273" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="42" y="283" width="885" height="103" rx="12" fill="#fff" stroke="#cbd5e1"/>
<circle cx="79" cy="318" r="20" fill="#0e7490"/>
<text x="79" y="325" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="20">2</text>
<text x="116" y="322" fill="#0f2942" font-family="Arial, sans-serif" font-size="21" font-weight="700">MIỀN VÀ RÀNG BUỘC</text>
<text x="64" y="361" fill="#334155" font-family="Arial, sans-serif" font-size="18">Clip tọa độ; kiểm tra khoảng cách UAV; vi phạm → fitness −∞.</text>
<path d="M484 391 V416" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="42" y="426" width="885" height="103" rx="12" fill="#fff" stroke="#cbd5e1"/>
<circle cx="79" cy="461" r="20" fill="#0e7490"/>
<text x="79" y="468" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="20">3</text>
<text x="116" y="465" fill="#0f2942" font-family="Arial, sans-serif" font-size="21" font-weight="700">LIÊN KẾT UAV–USER</text>
<text x="64" y="504" fill="#334155" font-family="Arial, sans-serif" font-size="18">Khoảng cách 3D → góc → xác suất LoS → suy hao → SNR.</text>
<path d="M484 534 V559" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="42" y="569" width="885" height="103" rx="12" fill="#fff" stroke="#cbd5e1"/>
<circle cx="79" cy="604" r="20" fill="#0e7490"/>
<text x="79" y="611" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="20">4</text>
<text x="116" y="608" fill="#0f2942" font-family="Arial, sans-serif" font-size="21" font-weight="700">BA THÀNH PHẦN</text>
<text x="64" y="647" fill="#334155" font-family="Arial, sans-serif" font-size="18">C: phủ user • E: proxy công suất • I: chồng lấn theo user</text>
<path d="M484 677 V702" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="42" y="712" width="885" height="103" rx="12" fill="#fff" stroke="#cbd5e1"/>
<circle cx="79" cy="747" r="20" fill="#0e7490"/>
<text x="79" y="754" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="20">5</text>
<text x="116" y="751" fill="#0f2942" font-family="Arial, sans-serif" font-size="21" font-weight="700">ĐIỂM TỔNG HỢP</text>
<text x="64" y="790" fill="#334155" font-family="Arial, sans-serif" font-size="18">F = 0,6 × C − 0,2 × E − 0,2 × I; càng cao càng tốt.</text>
<path d="M484 820 V845" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="42" y="855" width="885" height="103" rx="12" fill="#fff" stroke="#cbd5e1"/>
<circle cx="79" cy="890" r="20" fill="#0e7490"/>
<text x="79" y="897" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="20">6</text>
<text x="116" y="894" fill="#0f2942" font-family="Arial, sans-serif" font-size="21" font-weight="700">TRẢ KẾT QUẢ VỀ TÌM KIẾM</text>
<text x="64" y="933" fill="#334155" font-family="Arial, sans-serif" font-size="18">Thuật toán dùng điểm để chọn/cập nhật; không thay tọa độ user.</text>
</svg>
