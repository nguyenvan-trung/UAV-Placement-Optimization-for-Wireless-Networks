<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1023" viewBox="0 0 1000 1023" role="img" aria-labelledby="title desc">
<title id="title">H-WOA-PSO — TRỘN HAI ĐỀ XUẤT CHO MỖI CÁ THỂ</title>
<desc id="desc">1. TRẠNG THÁI HIỆN TẠI: Một cá thể có vị trí x, vận tốc v, pbest; dùng chung global best. 2. ĐỀ XUẤT WOA: Tính x_WOA từ một trong ba nhánh WOA. 3. ĐỀ XUẤT PSO: Tính v mới; đề xuất vị trí x + v từ cùng trạng thái hiện tại. 4. TRỘN VỊ TRÍ: x_mới = 0,5 × x_WOA + 0,5 × (x + v); sau đó clip biên. 5. ĐÁNH GIÁ VÀ CẬP NHẬT: Chấm fitness; cập nhật pbest và best toàn cục. 6. LẶP / ABLATION NHÁNH VẬN TỐC: Tắt lực hút pbest hoặc gbest; nhánh WOA vẫn dùng global best.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker></defs>
<rect width="1000" height="1023" rx="18" fill="#f1f5f9"/>
<rect width="1000" height="112" rx="18" fill="#0f2942"/>
<text x="42" y="47" fill="#fff" font-family="Arial, sans-serif" font-size="25" font-weight="700">H-WOA-PSO — TRỘN HAI ĐỀ XUẤT CHO MỖI CÁ THỂ</text>
<text x="42" y="81" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="18">Không chia quần thể thành hai nửa</text>
<rect x="42" y="140" width="885" height="103" rx="12" fill="#fff" stroke="#cbd5e1"/>
<circle cx="79" cy="175" r="20" fill="#0e7490"/>
<text x="79" y="182" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="20">1</text>
<text x="116" y="179" fill="#0f2942" font-family="Arial, sans-serif" font-size="21" font-weight="700">TRẠNG THÁI HIỆN TẠI</text>
<text x="64" y="218" fill="#334155" font-family="Arial, sans-serif" font-size="18">Một cá thể có vị trí x, vận tốc v, pbest; dùng chung global best.</text>
<path d="M484 248 V273" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="42" y="283" width="885" height="103" rx="12" fill="#fff" stroke="#cbd5e1"/>
<circle cx="79" cy="318" r="20" fill="#0e7490"/>
<text x="79" y="325" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="20">2</text>
<text x="116" y="322" fill="#0f2942" font-family="Arial, sans-serif" font-size="21" font-weight="700">ĐỀ XUẤT WOA</text>
<text x="64" y="361" fill="#334155" font-family="Arial, sans-serif" font-size="18">Tính x_WOA từ một trong ba nhánh WOA.</text>
<path d="M484 391 V416" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="42" y="426" width="885" height="103" rx="12" fill="#fff" stroke="#cbd5e1"/>
<circle cx="79" cy="461" r="20" fill="#0e7490"/>
<text x="79" y="468" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="20">3</text>
<text x="116" y="465" fill="#0f2942" font-family="Arial, sans-serif" font-size="21" font-weight="700">ĐỀ XUẤT PSO</text>
<text x="64" y="504" fill="#334155" font-family="Arial, sans-serif" font-size="18">Tính v mới; đề xuất vị trí x + v từ cùng trạng thái hiện tại.</text>
<path d="M484 534 V559" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="42" y="569" width="885" height="103" rx="12" fill="#fff" stroke="#cbd5e1"/>
<circle cx="79" cy="604" r="20" fill="#0e7490"/>
<text x="79" y="611" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="20">4</text>
<text x="116" y="608" fill="#0f2942" font-family="Arial, sans-serif" font-size="21" font-weight="700">TRỘN VỊ TRÍ</text>
<text x="64" y="647" fill="#334155" font-family="Arial, sans-serif" font-size="18">x_mới = 0,5 × x_WOA + 0,5 × (x + v); sau đó clip biên.</text>
<path d="M484 677 V702" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="42" y="712" width="885" height="103" rx="12" fill="#fff" stroke="#cbd5e1"/>
<circle cx="79" cy="747" r="20" fill="#0e7490"/>
<text x="79" y="754" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="20">5</text>
<text x="116" y="751" fill="#0f2942" font-family="Arial, sans-serif" font-size="21" font-weight="700">ĐÁNH GIÁ VÀ CẬP NHẬT</text>
<text x="64" y="790" fill="#334155" font-family="Arial, sans-serif" font-size="18">Chấm fitness; cập nhật pbest và best toàn cục.</text>
<path d="M484 820 V845" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="42" y="855" width="885" height="103" rx="12" fill="#fff" stroke="#cbd5e1"/>
<circle cx="79" cy="890" r="20" fill="#0e7490"/>
<text x="79" y="897" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="20">6</text>
<text x="116" y="894" fill="#0f2942" font-family="Arial, sans-serif" font-size="21" font-weight="700">LẶP / ABLATION NHÁNH VẬN TỐC</text>
<text x="64" y="933" fill="#334155" font-family="Arial, sans-serif" font-size="18">Tắt lực hút pbest hoặc gbest; nhánh WOA vẫn dùng global best.</text>
<path d="M930 905 H965 V333 H934" fill="none" stroke="#0e7490" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
</svg>
